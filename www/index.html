function tone(type,f1,f2,dur,vol){const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+0.02);}

 const push=()=>{b.hist.unshift({x:b.hx,y:b.hy});if(b.hist.length>HLEN)b.hist.pop();};

 if(b.st==='dying'){b.t++;if(b.t===1)boom(b.hx,Math.min(b.hy,GY-10),30,0,'x');if(b.t%7===0&&b.t/7<=SEGN){const s=segPts()[Math.min(SEGN-1,(b.t/7|0)-1)];if(s.y<GY+8)boom(s.x,Math.min(s.y,GY-4),16,0,'x');}

 if(ph2&&!b.spawned){b.spawned=true;for(const x of [ARENA+40,ARENA+320]){const e=mkE('goz',x);e.act=true;enemies.push(e);}}
 if(b.st==='enter'||b.st==='under'){b.t--;b.hx=b.ex;b.hy=GY+40;push();
  if(b.t<50){if(fr%3===0)parts.push({x:b.ex+rnd(-10,10),y:GY-2,vx:rnd(-1,1),vy:rnd(-2.5,-1),life:24,max:24,k:'smoke',s:3});if(fr%3===0)parts.push({x:b.ex+rnd(-12,12),y:GY-1,vx:rnd(-1.5,1.5),vy:rnd(-3,-1),life:30,max:30,k:'snow',s:1.2,g:0.15});if(b.t%10===0)shake(4,1.2);}
  if(b.t<=0){snd('boom');shake(8,3);for(let i=0;i<18;i++)parts.push({x:b.ex,y:GY-2,vx:rnd(-3,3),vy:rnd(-5,-1),life:40,max:40,k:'snow',s:1.5,g:0.18});
   if(b.riseNext){b.st='rise';b.hx=b.ex;b.hy=GY+8;}else{b.st='arc';b.hy=GY+8;b.vy=ph2?-9.4:-8.8;const air=2*(-b.vy)/0.28,tx=clamp(pcx+(pcx<b.ex?-30:30),ARENA+20,ARENA+W-20);b.vx=clamp((tx-b.ex)/air*1.8,-4.5,4.5);}}return;}
 if(b.st==='arc'){b.vy+=0.28;b.hx=clamp(b.hx+b.vx,ARENA+12,ARENA+W-12);b.hy+=b.vy;b.ang=Math.atan2(b.vy,b.vx);push();if(b.hy>GY+6&&b.vy>0){b.st='sink';b.t=0;for(let i=0;i<12;i++)parts.push({x:b.hx,y:GY-2,vx:rnd(-3,3),vy:rnd(-4,-1),life:36,max:36,k:'snow',s:1.4,g:0.18});shake(6,2);}}

 const tb=tBox(),pcx=tb.x+tb.w/2,ph2=b.hp<b.max/2;

 if(ph2&&!b.spawned){b.spawned=true;for(const x of [ARENA+30,ARENA+300]){const e=mkE('goz',x);e.act=true;enemies.push(e);}}
 if(b.st==='idle'){if(b.x>ARENA+W-90)b.vx=-0.5;else if(b.x<ARENA+190)b.vx=0.5;b.x+=b.vx*(ph2?1.6:1);b.anim+=0.08;if(--b.t<=0){b.atk=(b.atk+1)%3;b.st=['bolts','beam','stomp'][b.atk];b.t=0;}}

function boom(x,y,r,dmg,f){
 parts.push({x,y,vx:0,vy:0,life:8,max:8,k:'flash',s:r});
 for(let i=0;i<r;i++){const a=Math.random()*6.28,s=Math.random()*r/9;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.6,life:rnd(12,26),max:26,k:'fire',s:rnd(2,5)});}
 for(let i=0;i<r/3;i++)parts.push({x:x+rnd(-r/2,r/2),y:y+rnd(-r/2,0),vx:rnd(-.3,.3),vy:rnd(-.8,-.2),life:rnd(30,50),max:50,k:'smoke',s:rnd(4,7)});
 shake(Math.round(r/2),r/10);snd('boom');
 if(f==='p'){for(const e of enemies){if(!e.act||e.dead)continue;if(cr(x,y,r,e))dmgEnemy(e,dmg);}if(B&&cr(x,y,r,bossBox()))dmgBoss(dmg);}
 else if(f==='e'){if(!P.dead&&cr(x,y,r*0.8,tBox()))hitPlayer();}}
function updBullets(){const tb=tBox();
 for(const b of bullets){b.x+=b.vx;b.y+=b.vy;b.life--;
  if(b.k==='f'){b.vy-=0.025;b.vx*=0.985;if(b.w<11){b.w+=0.25;b.h+=0.25;b.x-=0.125;b.y-=0.125;}}
  if(b.y>GY){if(b.k!=='f')spark(b.x,GY);b.life=0;}
  if(b.x<cam.x-30||b.x>cam.x+W+30||b.y<-30)b.life=0;
  if(b.life<=0)continue;
  if(b.f==='p'){
   if(B&&B.kind==='evren'&&evrenBlock(b)){spark(b.x,b.y);b.life=0;continue;}
   if(B&&B.st!=='enter'&&B.st!=='dying'&&ov(b,bossBox())){if(b.k==='f'){if(!b.hs.has(B)){b.hs.add(B);dmgBoss(b.d);}}else{dmgBoss(b.d);spark(b.x,b.y);b.life=0;continue;}}
   for(const e of enemies){if(!e.act||e.dead)continue;if(ov(b,e)){if(e.t==='kalkan'&&!e.sh&&b.vx&&Math.sign(b.vx)===-e.face){spark(b.x,b.y);snd('clink');b.life=0;break;}if(b.k==='f'){if(!b.hs.has(e)){b.hs.add(e);dmgEnemy(e,b.d);}}else{dmgEnemy(e,b.d);spark(b.x,b.y);b.life=0;break;}}}}
  else if(!P.dead&&ov(b,tb)){hitPlayer();b.life=0;}}
 bullets=bullets.filter(b=>b.life>0);}
function updNades(){const tb=tBox();
 for(const n of nades){n.t++;n.vy+=GRAV*(n.k==='c'?0.22:1);n.x+=n.vx;n.y+=n.vy;let hit=n.y>=GY-2;
  if(n.f==='p'){if(B&&B.st!=='enter'&&B.st!=='dying'&&pin(n,bossBox()))hit=true;for(const e of enemies)if(e.act&&!e.dead&&pin(n,e))hit=true;}
  else if(!P.dead&&pin(n,tb))hit=true;
  if(n.x<cam.x-40||n.x>cam.x+W+40){n.dead=true;continue;}
  if(hit){n.dead=true;const y=Math.min(n.y,GY-2);if(n.f==='p')boom(n.x,y,n.k==='c'?28:30,n.k==='c'?8:6,'p');else boom(n.x,y,n.k==='s'?18:14,1,'e');}}
 nades=nades.filter(n=>!n.dead);}
function updParts(){for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;if(p.k==='smoke'){p.s+=0.06;p.vy*=0.99;}else if(p.k==='fire'){p.vx*=0.92;p.vy*=0.92;}else if(p.k==='gear'&&p.y>GY){p.y=GY;p.vy*=-0.4;p.vx*=0.6;}p.life--;}parts=parts.filter(p=>p.life>0);if(parts.length>700)parts.splice(0,parts.length-700);}

const OL='#1e130b';
const SHC={};
function shade(h,a){const k=h+a;if(SHC[k])return SHC[k];let n=parseInt(h.slice(1),16),r=n>>16,gg=n>>8&255,b=n&255;const f=a<0?0:255,p=Math.abs(a);r=Math.round((f-r)*p+r);gg=Math.round((f-gg)*p+gg);b=Math.round((f-b)*p+b);return SHC[k]='#'+((1<<24)|(r<<16)|(gg<<8)|b).toString(16).slice(1);}
function circ(x,y,r){g.beginPath();g.arc(x,y,Math.max(0.01,r),0,6.2832);}
function ell(x,y,rx,ry,rot=0){g.beginPath();g.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),rot,0,6.2832);}
function rrect(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function cap(x1,y1,x2,y2,r){const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.arc(x1,y1,r,a+Math.PI/2,a-Math.PI/2);g.arc(x2,y2,r,a-Math.PI/2,a+Math.PI/2);g.closePath();}
function poly(p){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();}
function fs(fill,ol=OL,lw=0.45){g.fillStyle=fill;g.fill();if(ol){g.lineWidth=lw;g.strokeStyle=ol;g.lineJoin='round';g.stroke();}}
function lg(x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>gr.addColorStop(i/(st.length-1),c));return gr;}
function rg(x,y,r0,r1,st,x1=x,y1=y){const gr=g.createRadialGradient(x,y,r0,x1,y1,r1);st.forEach((c,i)=>gr.addColorStop(i/(st.length-1),c));return gr;}
function ln(x1,y1,x2,y2,c,w){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.stroke();}
function srand(s){return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=Math.ceil(w*BS);c.height=Math.ceil(h*BS);const old=g;g=c.getContext('2d');g.scale(BS,BS);try{fn();}finally{g=old;}return c;}
const GLS={};
function glowSpr(rgb){if(GLS[rgb])return GLS[rgb];const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const gr=x.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(0.3,`rgba(${rgb},0.5)`);gr.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=gr;x.fillRect(0,0,64,64);return GLS[rgb]=c;}
